{% load i18n %}

<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Access Denied" %}</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fbf7f2;
            font-family: Arial, sans-serif;
            color: #111;
            padding: 20px;
        }

        .forbidden-card {
            max-width: 520px;
            width: 100%;
            background: #fff;
            border-radius: 28px;
            padding: 40px 28px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
            border: 1px solid #eadcc8;
        }

        .forbidden-icon {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            margin: 0 auto 18px;
            background: #fff2f2;
            color: #d32f2f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        .forbidden-card h1 {
            margin: 0 0 12px;
            font-size: 30px;
            font-weight: 900;
        }

        .forbidden-card p {
            margin: 0 auto 24px;
            color: #666;
            line-height: 1.7;
            max-width: 400px;
        }

        .forbidden-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 12px 24px;
            border-radius: 999px;
            background: #111;
            color: #fff;
            text-decoration: none;
            font-weight: 800;
        }

        .forbidden-btn:hover {
            background: #c6a46a;
            color: #111;
        }
    </style>
</head>
<body>
    <div class="forbidden-card">
        <div class="forbidden-icon">🚫</div>

        <h1>{% trans "Access Denied" %}</h1>

        <p>
            {% trans "Oops! You do not have permission to access this page. This area is reserved for administrators only." %}
        </p>

        <a href="{% url 'index' %}" class="forbidden-btn">
            {% trans "Go to Home Page" %}
        </a>
    </div>
</body>
</html>
